{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}
  Редактирование профиля
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card col-md-6 mx-auto">
    <div class="card-body">
      <h2>Редактировать профиль</h2>
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
